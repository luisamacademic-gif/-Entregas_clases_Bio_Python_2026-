<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entregas Programación - Bio-Python</title>
    <style>
        /* ========== Reset & base ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1115;
            color: #e6e8ef;
        }

        /* ========== Layout ========== */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ========== Sidebar ========== */
        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background: #161923;
            border-right: 1px solid #262b3a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 1.05rem;
            line-height: 1.35;
            font-weight: 600;
            color: #e6e8ef;
            padding: 24px 20px 16px;
            margin: 0;
            border-bottom: 1px solid #262b3a;
        }
        .sidebar-title span {
            color: #6c8cff;
            font-weight: 700;
        }

        .tabs {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 2px;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: #8b90a3;
            font-size: 0.92rem;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #e6e8ef;
        }
        .tab-btn.active {
            background: rgba(108, 140, 255, 0.15);
            color: #6c8cff;
            font-weight: 600;
        }

        .tab-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .tab-btn.active .tab-num {
            background: #6c8cff;
            color: #0f1115;
        }

        /* ========== Content ========== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px;
        }

        .panel {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .panel.active {
            display: flex;
        }

        .panel-header {
            margin-bottom: 20px;
        }
        .panel-header h2 {
            margin: 0 0 6px;
            font-size: 1.4rem;
        }
        .panel-header p {
            margin: 0;
            color: #8b90a3;
            font-size: 0.9rem;
        }

        /* ========== PDF embed ========== */
        .pdf-wrapper {
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2f40;
            background: #20232e;
            min-height: 0;
        }
        .pdf-wrapper embed,
        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .pdf-fallback {
            padding: 20px 0 0;
            color: #8b90a3;
            font-size: 0.9rem;
        }
        .pdf-fallback a {
            color: #6c8cff;
            text-decoration: none;
        }
        .pdf-fallback a:hover {
            text-decoration: underline;
        }

        /* ========== Empty state ========== */
        .empty-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #2a2f40;
            border-radius: 12px;
            background: #1b1f2b;
            color: #8b90a3;
            font-size: 0.95rem;
            text-align: center;
            padding: 40px;
        }

        /* ========== Introducción specific styles ========== */
        .intro-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #1b1f2b;
            padding: 60px 40px;
            text-align: center;
            border: 1px solid #2a2f40;
        }

        .intro-card .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c8cff, #4a6cf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(108, 140, 255, 0.25);
        }

        .intro-card h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #e6e8ef;
        }

        .intro-card .subtitle {
            font-size: 1.1rem;
            color: #6c8cff;
            margin-bottom: 16px;
        }

        .intro-card .description {
            max-width: 500px;
            color: #8b90a3;
            line-height: 1.7;
            font-size: 1rem;
        }

        .intro-card .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(108, 140, 255, 0.12);
            color: #6c8cff;
            font-size: 0.85rem;
            border: 1px solid rgba(108, 140, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="sidebar-title">Entregas Programación<br><span>Bio-Python</span></h1>
            <nav class="tabs" id="tabs"></nav>
        </aside>

        <!-- Main content -->
        <main class="content" id="content"></main>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const TOTAL_ENTREGAS = 2; // Solo 2 entregas
        const CARPETA_PDFS = 'Entregas_Semana_1/'; // Carpeta correcta

        // ============================================================
        // ELEMENTOS DOM
        // ============================================================
        const tabsEl = document.getElementById('tabs');
        const contentEl = document.getElementById('content');

        // ============================================================
        // CONSTRUIR PESTAÑAS
        // ============================================================
        function buildTabs() {
            // Pestaña de Introducción
            const introBtn = document.createElement('button');
            introBtn.className = 'tab-btn';
            introBtn.dataset.tab = 'intro';
            introBtn.innerHTML = `<span class="tab-num">📖</span> Introducción`;
            introBtn.addEventListener('click', () => activateTab('intro'));
            tabsEl.appendChild(introBtn);

            // Separador visual
            const separator = document.createElement('div');
            separator.style.cssText = 'height: 1px; background: #262b3a; margin: 6px 10px;';
            tabsEl.appendChild(separator);

            // Pestañas de entregas (solo 2)
            for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.dataset.tab = i;
                btn.innerHTML = `<span class="tab-num">${i}</span> Semana ${i}`;
                btn.addEventListener('click', () => activateTab(i));
                tabsEl.appendChild(btn);
            }
        }

        // ============================================================
        // CONSTRUIR PANELES
        // ============================================================
        function buildPanels() {
            // Panel de Introducción
            const introPanel = document.createElement('section');
            introPanel.className = 'panel';
            introPanel.id = 'panel-intro';
            introPanel.innerHTML = `
                <div class="intro-card">
                    <div class="avatar">LM</div>
                    <h1>Luisa Fernanda Muñoz</h1>
                    <div class="subtitle">Estudiante de Pregrado · Biología</div>
                    <p class="description">
                        Apasionada por la intersección entre la biología y la programación. 
                        Este repositorio contiene mis entregas del curso Bio-Python, 
                        donde combino mis conocimientos en ciencias biológicas con 
                        herramientas computacionales para el análisis de datos.
                    </p>
                    <div class="badge">📚 Promoción 2026</div>
                </div>
            `;
            contentEl.appendChild(introPanel);

            // Paneles de entregas (solo 2)
            for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
                const panel = document.createElement('section');
                panel.className = 'panel';
                panel.id = `panel-${i}`;

                // Ruta correcta: Entregas_Semana_1/Semana1.pdf y Semana2.pdf
                const pdfPath = `${CARPETA_PDFS}Semana${i}.pdf`;
                
                panel.innerHTML = `
                    <div class="panel-header">
                        <h2>Semana ${i}</h2>
                        <p>Visualización embebida: ${pdfPath}</p>
                    </div>
                    <div class="pdf-wrapper">
                        <embed src="${pdfPath}" type="application/pdf" />
                    </div>
                    <div class="pdf-fallback">
                        Si el PDF no se visualiza correctamente, puedes
                        <a href="${pdfPath}" target="_blank" rel="noopener">
                            abrirlo en una nueva pestaña
                        </a>.
                    </div>
                `;

                contentEl.appendChild(panel);
            }
        }

        // ============================================================
        // ACTIVAR PESTAÑA / PANEL
        // ============================================================
        function activateTab(id) {
            // Actualizar pestañas
            document.querySelectorAll('.tab-btn').forEach((btn) => {
                const isActive = btn.dataset.tab === String(id);
                btn.classList.toggle('active', isActive);
            });

            // Actualizar paneles
            document.querySelectorAll('.panel').forEach((panel) => {
                const panelId = panel.id === `panel-${id}`;
                panel.classList.toggle('active', panelId);
            });

            // Actualizar hash de la URL
            if (id === 'intro') {
                window.location.hash = 'introduccion';
            } else {
                window.location.hash = `semana-${id}`;
            }
        }

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        function init() {
            buildTabs();
            buildPanels();

            // Leer hash de la URL
            const hash = window.location.hash;
            let initial = 'intro';

            if (hash) {
                const introMatch = hash.match(/introduccion/);
                const entregaMatch = hash.match(/semana-(\d+)/);
                
                if (introMatch) {
                    initial = 'intro';
                } else if (entregaMatch) {
                    const num = Number(entregaMatch[1]);
                    if (num >= 1 && num <= TOTAL_ENTREGAS) {
                        initial = num;
                    }
                }
            }

            activateTab(initial);
        }

        // Arrancar
        init();
    </script>

</body>
</html>
