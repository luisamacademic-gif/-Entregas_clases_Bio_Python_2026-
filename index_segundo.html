<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkKeeper · Reductor de enlaces</title>
    <!-- Font Awesome (opcional, pero añade estilo) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .app-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -10px rgba(0, 20, 30, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            padding: 2rem 2rem 2.5rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b2b3b;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.3rem;
        }

        .subhead {
            color: #2c4b5c;
            font-weight: 400;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 1rem;
            margin-bottom: 1.8rem;
        }

        .subhead span i {
            margin-right: 6px;
            color: #2f7a9e;
        }

        .stats {
            background: rgba(0, 0, 0, 0.02);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            color: #1f4b5e;
            backdrop-filter: blur(2px);
        }

        /* formulario */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.4);
            padding: 1.5rem 1.8rem;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02), 0 6px 12px rgba(0, 20, 30, 0.06);
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
        }

        .input-group input {
            flex: 1 1 180px;
            padding: 0.8rem 1.2rem;
            border: none;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            border-radius: 60px;
            font-size: 0.95rem;
            color: #0a1e29;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02), inset 0 1px 3px rgba(0,0,0,0.05);
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .input-group input:focus {
            outline: none;
            background: white;
            box-shadow: 0 4px 12px rgba(30, 100, 140, 0.12);
            border-color: #7ab7d9;
        }

        .input-group input::placeholder {
            color: #6b8b9c;
            font-weight: 300;
        }

        .btn-primary {
            background: #0f3448;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 14px rgba(12, 52, 74, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 0.2px;
        }

        .btn-primary:hover {
            background: #1a4b64;
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(10, 50, 70, 0.25);
        }

        .btn-primary i {
            font-size: 1rem;
        }

        .btn-danger {
            background: transparent;
            border: none;
            color: #b13e4b;
            cursor: pointer;
            transition: 0.15s;
            font-size: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            background: rgba(200, 70, 80, 0.04);
        }

        .btn-danger:hover {
            background: rgba(200, 70, 80, 0.12);
            color: #a12f3c;
        }

        /* lista de enlaces */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.5rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .links-container::-webkit-scrollbar {
            width: 5px;
        }

        .links-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 20px;
        }

        .links-container::-webkit-scrollbar-thumb {
            background: #b6d2e2;
            border-radius: 20px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            padding: 0.9rem 1.5rem 0.9rem 1.8rem;
            border-radius: 80px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.12s;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 6px 16px rgba(0, 20, 30, 0.06);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }

        .link-name {
            font-weight: 500;
            color: #0e2e3d;
            font-size: 1rem;
            word-break: break-word;
            min-width: 80px;
        }

        .link-url {
            color: #2f6d89;
            font-size: 0.85rem;
            text-decoration: none;
            border-bottom: 1px dashed rgba(40, 100, 130, 0.2);
            transition: 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .link-url:hover {
            color: #0b3b52;
            border-bottom-color: #2f7a9e;
        }

        .link-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            margin-left: 0.5rem;
        }

        .link-actions a {
            background: rgba(30, 80, 110, 0.04);
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            color: #1e5e7a;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .link-actions a:hover {
            background: #1f5b77;
            color: white;
            border-color: #1f5b77;
        }

        .link-actions .btn-danger {
            font-size: 1.1rem;
            padding: 0.2rem 0.6rem;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #3d6277;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 80px;
            backdrop-filter: blur(2px);
        }

        .empty-state i {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 0.4rem;
            display: block;
        }

        .footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.03);
            padding-top: 1.5rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(30, 70, 90, 0.15);
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            color: #1e4b61;
            font-weight: 450;
            cursor: pointer;
            transition: 0.1s;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline:hover {
            background: rgba(0,0,0,0.02);
            border-color: #3d7a99;
            color: #0d3346;
        }

        .btn-outline i {
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .app-card {
                padding: 1.5rem 1rem;
                border-radius: 32px;
            }
            .form-row {
                padding: 1.2rem;
            }
            .input-group {
                flex-direction: column;
                align-items: stretch;
            }
            .link-item {
                flex-wrap: wrap;
                padding: 1rem 1.2rem;
                border-radius: 40px;
                gap: 0.5rem;
            }
            .link-info {
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .link-url {
                max-width: 100%;
                white-space: normal;
                word-break: break-all;
            }
            .link-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="app-card" role="main">
        <header>
            <h1>
                <i class="fas fa-link" style="color: #1d5a7a;"></i> LinkKeeper
            </h1>
            <div class="subhead">
                <span><i class="fas fa-compress-alt"></i> Reduce enlaces, organiza tu red</span>
                <span class="stats" id="statsCounter"><i class="far fa-bookmark"></i> 0 enlaces</span>
            </div>
        </header>

        <!-- Formulario agregar -->
        <div class="form-row">
            <div class="input-group">
                <input type="text" id="linkNameInput" placeholder="Nombre (ej. GitHub)" aria-label="Nombre del enlace">
                <input type="url" id="linkUrlInput" placeholder="https://ejemplo.com" aria-label="URL del enlace">
                <button class="btn-primary" id="addLinkBtn"><i class="fas fa-plus-circle"></i> Agregar</button>
            </div>
            <div style="font-size:0.8rem; color:#3b6a81; padding-left:0.5rem; opacity:0.8;">
                <i class="fas fa-info-circle"></i> Pegá tu enlace, ponle nombre y guarda.
            </div>
        </div>

        <!-- Lista de enlaces -->
        <div id="linksList" class="links-container">
            <!-- Los items se inyectan dinámicamente -->
            <div class="empty-state" id="emptyMessage">
                <i class="fas fa-folder-open"></i>
                <span>No hay enlaces guardados aún.</span>
                <span style="display:block; font-size:0.9rem; margin-top:6px;">Agrega tus primeros enlaces para reducir el caos.</span>
            </div>
        </div>

        <!-- Acciones extra -->
        <div class="footer-actions">
            <button class="btn-outline" id="clearAllBtn"><i class="fas fa-eraser"></i> Limpiar todo</button>
            <button class="btn-outline" id="exportLinksBtn"><i class="fas fa-download"></i> Exportar</button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // --- Estado local ---
            let links = [];

            // --- DOM references ---
            const linkNameInput = document.getElementById('linkNameInput');
            const linkUrlInput = document.getElementById('linkUrlInput');
            const addBtn = document.getElementById('addLinkBtn');
            const linksContainer = document.getElementById('linksList');
            const statsCounter = document.getElementById('statsCounter');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const exportBtn = document.getElementById('exportLinksBtn');
            const emptyMsg = document.getElementById('emptyMessage');

            // --- Cargar desde localStorage ---
            function loadLinks() {
                try {
                    const stored = localStorage.getItem('linkKeeper_data');
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            links = parsed;
                        }
                    }
                } catch (e) {
                    console.warn('No se pudo cargar datos:', e);
                }
                // Si no hay datos, inicializar con ejemplos (para mostrar funcionalidad)
                if (!links || links.length === 0) {
                    links = [
                        { id: Date.now() + 1, name: 'GitHub', url: 'https://github.com' },
                        { id: Date.now() + 2, name: 'MDN Web Docs', url: 'https://developer.mozilla.org' },
                        { id: Date.now() + 3, name: 'CSS Tricks', url: 'https://css-tricks.com' }
                    ];
                }
                renderLinks();
            }

            // --- Guardar en localStorage ---
            function saveLinks() {
                try {
                    localStorage.setItem('linkKeeper_data', JSON.stringify(links));
                } catch (e) {
                    console.warn('No se pudo guardar:', e);
                }
                updateStats();
            }

            // --- Actualizar contador y estado vacío ---
            function updateStats() {
                const count = links.length;
                statsCounter.innerHTML = `<i class="far fa-bookmark"></i> ${count} enlace${count !== 1 ? 's' : ''}`;
                
                // Mostrar/ocultar mensaje vacío
                if (count === 0) {
                    if (!document.getElementById('emptyMessage')) {
                        const emptyDiv = document.createElement('div');
                        emptyDiv.id = 'emptyMessage';
                        emptyDiv.className = 'empty-state';
                        emptyDiv.innerHTML = `
                            <i class="fas fa-folder-open"></i>
                            <span>No hay enlaces guardados aún.</span>
                            <span style="display:block; font-size:0.9rem; margin-top:6px;">Agrega tus primeros enlaces para reducir el caos.</span>
                        `;
                        linksContainer.appendChild(emptyDiv);
                    }
                } else {
                    const emptyEl = document.getElementById('emptyMessage');
                    if (emptyEl) emptyEl.remove();
                }
            }

            // --- Renderizar todos los enlaces ---
            function renderLinks() {
                // Limpiar contenedor (pero mantener el empty si existe)
                const items = linksContainer.querySelectorAll('.link-item');
                items.forEach(el => el.remove());

                // Si no hay enlaces, mostramos el mensaje vacío (lo maneja updateStats)
                if (links.length === 0) {
                    updateStats();
                    return;
                }

                // Construir cada link-item
                links.forEach(link => {
                    const item = document.createElement('div');
                    item.className = 'link-item';
                    item.dataset.id = link.id;

                    // Info
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'link-info';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'link-name';
                    nameSpan.textContent = link.name || 'Sin nombre';

                    const urlAnchor = document.createElement('a');
                    urlAnchor.className = 'link-url';
                    urlAnchor.href = link.url;
                    urlAnchor.target = '_blank';
                    urlAnchor.rel = 'noopener noreferrer';
                    urlAnchor.textContent = link.url;

                    infoDiv.appendChild(nameSpan);
                    infoDiv.appendChild(urlAnchor);

                    // Acciones
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'link-actions';

                    // Botón visitar
                    const visitLink = document.createElement('a');
                    visitLink.href = link.url;
                    visitLink.target = '_blank';
                    visitLink.rel = 'noopener noreferrer';
                    visitLink.innerHTML = '<i class="fas fa-arrow-right"></i> Ir';
                    visitLink.style.background = 'rgba(30,80,110,0.04)';
                    
                    // Botón eliminar
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-danger';
                    delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    delBtn.setAttribute('aria-label', 'Eliminar enlace');
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteLink(link.id);
                    });

                    actionsDiv.appendChild(visitLink);
                    actionsDiv.appendChild(delBtn);

                    item.appendChild(infoDiv);
                    item.appendChild(actionsDiv);
                    linksContainer.appendChild(item);
                });

                updateStats();
            }

            // --- Agregar nuevo enlace ---
            function addLink() {
                let name = linkNameInput.value.trim();
                let url = linkUrlInput.value.trim();

                // Validaciones básicas
                if (!url) {
                    alert('Por favor, ingresa una URL válida.');
                    linkUrlInput.focus();
                    return;
                }

                // Si no hay nombre, usar el dominio o parte de la URL
                if (!name) {
                    try {
                        const urlObj = new URL(url);
                        name = urlObj.hostname.replace(/^www\./, '');
                    } catch (_) {
                        name = url.substring(0, 20);
                    }
                }

                // Asegurar protocolo
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }

                // Validar URL con new URL (opcional)
                try {
                    new URL(url);
                } catch (_) {
                    alert('La URL ingresada no es válida. Revisa el formato.');
                    linkUrlInput.focus();
                    return;
                }

                const newLink = {
                    id: Date.now() + Math.floor(Math.random() * 1000),
                    name: name.slice(0, 40),
                    url: url
                };

                links.push(newLink);
                saveLinks();
                renderLinks();

                // Limpiar campos
                linkNameInput.value = '';
                linkUrlInput.value = '';
                linkNameInput.focus();
            }

            // --- Eliminar enlace por ID ---
            function deleteLink(id) {
                links = links.filter(link => link.id !== id);
                saveLinks();
                renderLinks();
            }

            // --- Limpiar todos los enlaces (con confirmación) ---
            function clearAllLinks() {
                if (links.length === 0) return;
                if (confirm('¿Eliminar todos los enlaces guardados?')) {
                    links = [];
                    saveLinks();
                    renderLinks();
                }
            }

            // --- Exportar enlaces como JSON descargable ---
            function exportLinks() {
                if (links.length === 0) {
                    alert('No hay enlaces para exportar.');
                    return;
                }
                const dataStr = JSON.stringify(links, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `linkkeeper_export_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            // --- Eventos ---
            addBtn.addEventListener('click', addLink);

            // Enter en los campos
            linkNameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    linkUrlInput.focus();
                }
            });
            linkUrlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addLink();
                }
            });

            clearAllBtn.addEventListener('click', clearAllLinks);
            exportBtn.addEventListener('click', exportLinks);

            // --- Inicializar ---
            loadLinks();
        })();
    </script>
</body>
</html>
